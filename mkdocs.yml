site_name: wt
site_description: Ideas and mini-spec workflow, with passive time tracking
site_url: https://brunosmmm.github.io/wt/
docs_dir: docs/product
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: teal

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Getting started: guides/getting-started.md
      - Daily ops: guides/daily-ops.md
      - Weekly ops: guides/weekly-ops.md
      - Agent surface: guides/agent-surface.md
      - Org-mode storage: guides/org-storage.md
      - Track time: guides/track-time.md
      - Idea → ship: guides/idea-to-ship.md
      - Outbound: guides/outbound.md
      - Multi-project: guides/multi-project.md
  - Concepts:
      - concepts/index.md
      - Storage architecture: concepts/architecture.md
      - Lifecycle & DoD: concepts/lifecycle.md
      - Default portable (wt-native): concepts/portable-default.md
      - Workflow architecture: concepts/workflows.md
      - Time model & retention: concepts/time-and-retention.md
  - Capabilities:
      - capabilities/index.md
      - Report & topics: capabilities/report.md
      - Ideas & next: capabilities/ideas.md
      - Desk (TUI): capabilities/tui.md
      - Hub: capabilities/hub.md
      - Projects & outbound: capabilities/projects.md
      - Sheet sync: capabilities/sheet.md
      - Clock: capabilities/clock.md
      - Completion: capabilities/completion.md
      - Release archive: capabilities/release-archive.md
      - Tasks & agenda: capabilities/tasks-agenda.md
      - Meetings: capabilities/meetings.md
      - Skills: capabilities/skills.md
  - Reference: reference/index.md
  - Contribute: contribute/index.md
